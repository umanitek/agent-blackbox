name: Blackbox CI

# The Blackbox plugin's own lane. ci.yaml calls it when a pull request touches
# only the plugin's files (the ``blackbox_only`` lane of
# scripts/ci/classify_changes.py) and forces every host lane off: the host suites
# cannot observe a plugin change, and they are most of a CI run's minutes.
#
# One Linux runner: the Blackbox suite (tests/**/test_blackbox_*.py — the catalog
# admission test inside it runs ``hermes plugins validate``) and the blocking
# lints that ``scripts/check`` runs for the lint lane, judged against the base.
#
# And the root helper's Rust crate (plugins/blackbox/helper) on Linux x86_64 and
# arm64 — only when the crate or this file changed: ``cargo test --locked`` (its
# Linux platform code and fixture tests, and the nftables tests inside an
# unprivileged user + network namespace), then a release build of the musl
# targets the Linux release ships (built only, never uploaded).

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test. Empty keeps the triggering commit.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  blackbox:
    name: Blackbox suite + lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 2 # the merge commit and its first parent (the base branch tip)

      - name: Set up locked Python and test dependencies
        id: setup
        uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Install Blackbox's test-only packages
        # rdflib backs the in-memory graph store five Blackbox tests stand in for the
        # node with; the plugin never imports it. Hermes' lock pulls it only through the
        # text-to-speech extra, so it is installed here (same version as uv.lock) rather
        # than by editing Hermes' pyproject (upstream-first, Amos 2026-10-28).
        uses: ./.github/actions/retry
        with:
          command: uv pip install --python "${{ steps.setup.outputs.python-path }}" "rdflib==7.6.0"

      - name: Blackbox suite
        # scripts/run_tests.sh — the canonical runner, as every Hermes lane uses:
        # one pytest subprocess per file (isolated HERMES_HOME, no state leaking
        # between files), one worker per core. Bare pytest over the whole suite
        # in one process failed six tests that pass under this runner.
        run: |
          set -euo pipefail
          SEPARATOR="$(python -c 'import os, sys; sys.stdout.write(os.pathsep)')"
          FILES="$(ls tests/plugins/test_blackbox_*.py tests/test_blackbox_*.py | paste -sd "$SEPARATOR" -)"
          scripts/run_tests.sh --files "$FILES" -- -q --tb=short

      - name: Install pinned ruff
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages "$(python -m scripts.code_health --print-pins)"

      - name: Blocking lints against the base branch tip
        run: python scripts/check --base HEAD^1

      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree

  helper:
    name: Root helper (cargo, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            musl: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            musl: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/blackbox/helper
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 2 # the merge commit and its first parent (the base branch tip)

      - name: Did the helper change?
        id: changed
        working-directory: .
        # A pull request that leaves the crate alone spends no Rust minutes.
        run: |
          if git diff --quiet HEAD^1 HEAD -- plugins/blackbox/helper .github/workflows/blackbox-ci.yml 2>/dev/null; then
            echo "helper=false" >> "$GITHUB_OUTPUT"
          else
            echo "helper=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rust toolchain, nftables, musl and an unprivileged network namespace
        if: steps.changed.outputs.helper == 'true'
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
        # the nftables tests need one (``unshare -rn``), so the runner lifts it.
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add "${{ matrix.musl }}"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nftables musl-tools
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -rn true

      - name: cargo test
        if: steps.changed.outputs.helper == 'true'
        env:
          # The nftables tests must run here, not skip (they skip on a machine
          # without an unprivileged network namespace).
          BLACKBOX_REQUIRE_NETNS: '1'
        run: cargo test --locked

      - name: Release build of the musl target (not uploaded)
        if: steps.changed.outputs.helper == 'true'
        run: cargo build --release --locked --target "${{ matrix.musl }}"
