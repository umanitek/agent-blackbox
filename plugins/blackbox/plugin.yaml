name: blackbox
version: "1.4.1"  # the release number; kernel/constants.py __version__ and CHANGELOG.md match it
# The Hermes release this plugin is built and tested against (pm-managed installs,
# hermes_yaml, the register_* routes it uses). SemVer floor, as the catalog requires.
requires_hermes: ">=0.21.7"
# The libraries Blackbox imports that are not the standard library: report signing, the
# local dashboard, and the DKG node's process supervision. Hermes ships them in its core
# today; declared so Blackbox keeps working if that ever changes.
python_dependencies:
  - "cryptography>=41,<52"
  - "fastapi>=0.104,<1"
  - "uvicorn>=0.31,<1"
  - "psutil>=5.9,<9"   # Hermes pins 7.2.2, and 8.0.0 on Android (resolved for every platform at once)
# `backend` is the only bundled kind Hermes auto-loads without a per-home
# `plugins.enabled` entry (hermes_cli/plugins.py load gate). Blackbox must watch
# every session with zero setup, so it opts into eager auto-load this way. It
# registers no tool backend — only the lifecycle hooks below — so the load path
# is otherwise identical to a standalone plugin.
kind: backend
description: "Agent Blackbox — graph-driven agent security. Syncs a threat ruleset from the curated public Verifiable Memory graph and matches every tool call and model request against it: prompt-injection patterns, privilege-escalation tool shapes, and vulnerable dependency installs. Audit mode records findings locally; block mode refuses tool calls at/above a configured severity. It can also share privacy-safe threat reports (never prompt or command text, never secrets) with the threat graph's community area and flags (never blocks) what other nodes report; sharing is off by default and turned on with `blackbox report --enable-sharing` or the dashboard toggle, which record your agreement to the reporter terms. Fail-open everywhere."
author: Umanitek
# Every hook register() installs, declared so `hermes plugins validate` can check
# the plugin registers nothing it did not declare (catalog admission rule 6).
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_api_request
  - on_session_start
  - on_session_end
