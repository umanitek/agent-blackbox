[package]
name = "blackbox-helper"
version = "0.1.0"
edition = "2021"
description = "Blackbox's root helper (blackbox-netd): applies Network Shield's plan — DNS Shield, the Threat Firewall, lockdowns — and observes what needs root"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "blackbox_helper"
path = "src/lib.rs"

[[bin]]
name = "blackbox-netd"
path = "src/bin/blackbox-netd.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls so the build needs no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
sha2 = "0.10"
hex = "0.4"
sysinfo = { version = "=0.40.1", default-features = false, features = ["system", "user"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "=1.11.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
